<VirtualHost *:80>
    DocumentRoot /opt/remotelabz/public
    
    <Directory /opt/remotelabz/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory /opt/remotelabz>
        Options FollowSymLinks
    </Directory>

    <Directory /opt/remotelabz/public/bundles>
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # Indispensable pour la connexion JWT Symfony
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTPS} !=on
        # Redirige vers l'IP ou le nom de domaine tapé par l'utilisateur, pas vers localhost
        RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]
    </IfModule>
</VirtualHost>