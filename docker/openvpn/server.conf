# =============================================================================
# RemoteLabz – OpenVPN Server Configuration
# Mirrors the server.conf heredoc in install.sh :: setup_openvpn()
# =============================================================================

port 1194
proto udp
dev tun

tun-mtu 1400
mssfix 1360

# --- Certificates (populated by setup.sh) ---
ca   /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/RemoteLabz-VPNServer.crt
key  /etc/openvpn/server/RemoteLabz-VPNServer.key
dh   /etc/openvpn/server/dh2048.pem

cipher AES-256-GCM
tls-auth /etc/openvpn/server/ta.key 0

# --- Network ---
server 10.8.0.0 255.255.255.0
push "route 10.11.0.0 255.255.0.0"

keepalive 5 30
explicit-exit-notify 1
persist-key
persist-tun
duplicate-cn

# --- Logging ---
status /var/log/openvpn/openvpn-status.log
log    /var/log/openvpn/openvpn.log
verb 1
mute 20
