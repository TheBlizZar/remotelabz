# =============================================================================
# RemoteLabz – Docker Compose
# Services: MySQL · RabbitMQ · OpenVPN · Front (Apache/PHP)
# =============================================================================

services:

  front:
    build:
      context: .
      dockerfile: docker/front/Dockerfile
    container_name: remotelabz-front
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/opt/remotelabz
      - openvpn_server:/etc/openvpn/server
      - openvpn_clients:/etc/openvpn/client
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - remotelabz
    environment:
      - DATABASE_URL=mysql://user:Mysql-Pa33wrd-Safe@mysql:3306/remotelabz?serverVersion=8.0
      - MESSENGER_TRANSPORT_DSN=amqp://remotelabz-amqp:password-amqp@rabbitmq:5672/%2f/messages

  mysql:
    image: mysql:8.0
    container_name: remotelabz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "RemoteLabz-2022-Safe" 
      MYSQL_DATABASE:      remotelabz
      MYSQL_USER:          user
      MYSQL_PASSWORD:      "Mysql-Pa33wrd-Safe" 
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - remotelabz
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "user", "-pMysql-Pa33wrd-Safe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: remotelabz-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER:     remotelabz-amqp
      RABBITMQ_DEFAULT_PASS:     password-amqp
      RABBITMQ_DEFAULT_VHOST:    /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    networks:
      - remotelabz
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  openvpn:
    build:
      context: ./docker/openvpn
      dockerfile: Dockerfile
    container_name: remotelabz-openvpn
    restart: unless-stopped
    environment:
      CA_PASS:        "${CA_PASS:-R3mot3!abz-0penVPN-CA2020}"
      PEM_PASS:       "${PEM_PASS:-R3mot3!abz-0penVPN-CA2020}"
      PUBLIC_ADDRESS: "${PUBLIC_ADDRESS:-192.168.186.3}"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - openvpn_server:/etc/openvpn/server
      - openvpn_clients:/etc/openvpn/client
      - openvpn_logs:/var/log/openvpn
      - openvpn_easyrsa:/root/EasyRSA
    ports:
      - "${OPENVPN_PORT:-1194}:1194/udp"
    networks:
      - remotelabz
    sysctls:
      net.ipv4.ip_forward: 1

volumes:
  mysql_data:
    name: remotelabz_mysql_data
  rabbitmq_data:
    name: remotelabz_rabbitmq_data
  openvpn_server:
    name: remotelabz_openvpn_server
  openvpn_clients:
    name: remotelabz_openvpn_clients
  openvpn_logs:
    name: remotelabz_openvpn_logs
  openvpn_easyrsa:
    name: remotelabz_openvpn_easyrsa

networks:
  remotelabz:
    name: remotelabz_network
    driver: bridge